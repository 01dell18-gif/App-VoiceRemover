# ==============================================================================
# FYJ Channel Voice - Konfigurasi Nginx Reverse Proxy & Domain
# Letakkan file ini di: /etc/nginx/sites-available/fyj-voice
# Lalu buat symlink : sudo ln -s /etc/nginx/sites-available/fyj-voice /etc/nginx/sites-enabled/
# Uji konfigurasi   : sudo nginx -t
# Muat ulang Nginx  : sudo systemctl reload nginx
# ==============================================================================

# 1. Konfigurasi HTTP (Port 80)
server {
    listen 80;
    listen [::]:80;
    
    # Ganti dengan nama domain atau subdomain Anda
    server_name suara.domainanda.com;

    # Batas ukuran upload file audio hingga 100MB
    client_max_body_size 100M;

    # Lokasi file log
    access_log /var/log/nginx/fyj_voice_access.log;
    error_log /var/log/nginx/fyj_voice_error.log;

    # Reverse proxy ke aplikasi Node.js (Port default: 3032)
    location / {
        proxy_pass http://127.0.0.1:3032;
        proxy_http_version 1.1;

        # Header WebSocket untuk Socket.IO realtime progress
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward headers asli pengunjung
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeout pemrosesan AI (600 detik / 10 menit agar lagu panjang tidak terputus)
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # Buffer setting
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    # Optimasi cache untuk asset statis (gambar, css, js)
    location ~* \.(jpg|jpeg|png|gif|ico|svg|css|js|woff|woff2)$ {
        proxy_pass http://127.0.0.1:3032;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}

# ==============================================================================
# 2. PANDUAN MENGAKTIFKAN SSL / HTTPS GRATIS DENGAN CERTBOT:
# 
# Jalankan perintah berikut di terminal Linux:
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d suara.domainanda.com
# 
# Certbot akan otomatis mengubah file ini untuk menambahkan sertifikat HTTPS (port 443)
# dan mengalihkan port 80 ke HTTPS secara otomatis.
# ==============================================================================

